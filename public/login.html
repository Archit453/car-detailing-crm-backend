<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Signature Detailing CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#0284c7',
              600: '#0369a1',
              accent: '#38bdf8'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Subtle Background Glows -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Login Card -->
  <div class="glass-card w-full max-w-md p-6 sm:p-8 rounded-2xl border border-zinc-800 shadow-2xl relative z-10 space-y-6">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center mx-auto shadow-lg shadow-sky-500/25">
        <i data-lucide="shield-check" class="w-7 h-7 text-white"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white font-display">Signature Detailing</h1>
        <p class="text-xs text-zinc-400 mt-0.5">Admin CRM Dashboard Login</p>
      </div>
    </div>

    <!-- Error Alert Banner -->
    <div id="error-banner" class="hidden p-3 rounded-lg bg-red-950/60 border border-red-800/60 text-red-300 text-xs flex items-center space-x-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-red-400"></i>
      <span id="error-message">Invalid credentials.</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-medium text-zinc-300 mb-1.5">Username</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500"></i>
          <input 
            type="text" 
            id="username" 
            required 
            placeholder="admin"
            autocomplete="username"
            class="w-full bg-zinc-900/90 text-zinc-100 placeholder-zinc-500 pl-10 pr-4 py-2.5 rounded-lg border border-zinc-800 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm transition"
          >
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-medium text-zinc-300 mb-1.5">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500"></i>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••••••"
            autocomplete="current-password"
            class="w-full bg-zinc-900/90 text-zinc-100 placeholder-zinc-500 pl-10 pr-10 py-2.5 rounded-lg border border-zinc-800 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm transition"
          >
          <button 
            type="button" 
            id="btn-toggle-password" 
            class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300 transition"
          >
            <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <!-- Remember Me Info -->
      <div class="flex items-center justify-between text-xs text-zinc-400 pt-1">
        <span class="inline-flex items-center space-x-1.5 text-zinc-400">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-sky-400"></i>
          <span>Session remembered for 30 days</span>
        </span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="btn-submit"
        class="w-full flex items-center justify-center space-x-2 py-2.5 px-4 rounded-lg bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white text-sm font-semibold shadow-lg shadow-sky-600/20 transition transform active:scale-95 disabled:opacity-50"
      >
        <span>Sign In to Dashboard</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Footer Note -->
    <p class="text-[11px] text-center text-zinc-600">
      Protected by cryptographic HMAC-SHA256 session authentication
    </p>

  </div>

  <script>
    lucide.createIcons();

    // Check if already authenticated
    fetch('/api/auth/me')
      .then(res => {
        if (res.ok) window.location.href = '/dashboard';
      })
      .catch(() => {});

    // Toggle Password Visibility
    const btnToggle = document.getElementById('btn-toggle-password');
    const inputPassword = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    let isPasswordVisible = false;

    btnToggle.addEventListener('click', () => {
      isPasswordVisible = !isPasswordVisible;
      inputPassword.type = isPasswordVisible ? 'text' : 'password';
      eyeIcon.setAttribute('data-lucide', isPasswordVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    // Handle Form Submit
    const form = document.getElementById('login-form');
    const errorBanner = document.getElementById('error-banner');
    const errorMessage = document.getElementById('error-message');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `
        <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        <span>Authenticating...</span>
      `;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          btnSubmit.innerHTML = `<span>Redirecting...</span>`;
          window.location.href = '/dashboard';
        } else {
          errorMessage.textContent = data.error?.message || 'Invalid credentials. Please try again.';
          errorBanner.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Sign In to Dashboard</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
        }
      } catch (err) {
        errorMessage.textContent = 'Connection error. Please try again.';
        errorBanner.classList.remove('hidden');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Sign In to Dashboard</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
